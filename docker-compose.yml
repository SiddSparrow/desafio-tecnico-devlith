#
# Services definitions
#
services:
  app:
    image: kooldev/php:8.3-nginx
    ports:
      - "${KOOL_APP_PORT:-80}:80"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
    volumes:
      - .:/app:delegated
    networks:
      - local
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
  database:
    image: mysql:8.0
    ports:
      - ${KOOL_DATABASE_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE-database}
      MYSQL_PASSWORD: ${DB_PASSWORD-pass}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql:delegated
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    networks:
      - local
    healthcheck:
      test: ["CMD", "mysqladmin", "-p${DB_PASSWORD:-pass}", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  worker-export:
    image: kooldev/php:8.3-nginx
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["php /app/artisan queue:work --queue=export --sleep=3 --tries=3 --timeout=600"]
    restart: unless-stopped
    volumes:
      - .:/app:delegated
    networks:
      - local
    depends_on:
      database:
        condition: service_healthy
  worker-default:
    image: kooldev/php:8.3-nginx
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["php -d memory_limit=512M /app/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=600"]
    restart: unless-stopped
    volumes:
      - .:/app:delegated
    networks:
      - local
    deploy:
      replicas: 2
    depends_on:
      database:
        condition: service_healthy
  node:
    image: kooldev/node:20
    command: [ "npm", "run", "dev" ]
    ports:
      - "3001:3001"
    volumes:
      - .:/app:delegated
    networks:
      - local
    depends_on:
      - app
#
# Networks definitions
#
networks:
  local:
volumes:
  database:
